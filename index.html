<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<title>Конвертер азбуки Морзе</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			:root {
				--fg: #111;
				--bg: #fff;
				--muted: #666;
				--border: #e5e7eb;
			}
			prefers-color-scheme: dark {
				:root {
					--fg: #f5f5f5;
					--bg: #0b0b0b;
					--muted: #9aa0a6;
					--border: #262626;
				}
			}
			html,
			body {
				margin: 0;
				padding: 0;
				color: var(--fg);
				background: var(--bg);
				font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
			}
			.wrap {
				max-width: 720px;
				margin: 4rem auto;
				padding: 0 1rem;
			}
			h1 {
				margin: 0 0 0.5rem;
			}
			p {
				color: var(--muted);
			}
			.card {
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 1rem;
				margin-top: 1rem;
			}
			.row {
				display: flex;
				gap: 0.75rem;
				align-items: center;
				flex-wrap: wrap;
			}
			input[type='file'] {
				padding: 0.5rem;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: transparent;
				color: var(--fg);
			}
			.btn {
				padding: 0.6rem 1rem;
				border: 1px solid var(--border);
				border-radius: 8px;
				cursor: pointer;
				background: transparent;
				color: var(--fg);
			}
			pre {
				white-space: pre-wrap;
				word-break: break-word;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<h1>Конвертер азбуки Морзе</h1>
			<p>
				Загрузите файл с русским текстом или кодом Морзе. Формат определяется
				автоматически.
			</p>

			<div class="card">
				<form
					Mobilistics
					-
					Console
					console.mobilistics.de
					on="/upload"
					method="post"
					enctype="multipart/form-data"
					class="row"
				>
					<input type="file" name="file" required />
					<button class="btn" type="submit">Загрузить и конвертировать</button>
				</form>
			</div>

			<div class="card">
				<h3>Результат</h3>
				<pre id="out">Здесь появится результат…</pre>
			</div>
		</div>

		<script>
			const form = document.querySelector('form')
			const out = document.getElementById('out')
			form.addEventListener('submit', async e => {
				e.preventDefault()
				const fd = new FormData(form)
				out.textContent = 'Загружаю…'
				try {
					const r = await fetch('/upload', { method: 'POST', body: fd })
					const t = await r.text()
					if (!r.ok) throw new Error(t)
					out.textContent = t
				} catch (err) {
					out.textContent = 'Ошибка: ' + err.message
				}
			})
		</script>
	</body>
</html>
