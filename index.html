<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Конвертер азбуки Морзе</title>
  <style>
    :root { --fg:#111; --bg:#fff; --muted:#666; --border:#e5e7eb; }
    prefers-color-scheme: dark {
      :root { --fg:#f5f5f5; --bg:#0b0b0b; --muted:#9aa0a6; --border:#262626; }
    }
    html,body { margin:0; padding:0; color:var(--fg); background:var(--bg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif; }
    .wrap { max-width:720px; margin:3rem auto; padding:0 1rem; }
    h1 { margin:0 0 1rem; }
    p { color:var(--muted); }
    .card { border:1px solid var(--border); border-radius:12px; padding:1rem; }
    .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
    input[type=file]{ padding:.5rem; }
    button { padding:.5rem 1rem; border:1px solid var(--border); background:transparent; color:var(--fg); cursor:pointer; border-radius:8px; }
    pre { white-space:pre-wrap; border:1px dashed var(--border); border-radius:8px; padding:1rem; min-height:4rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Конвертер азбуки Морзе</h1>
    <p>Загрузите файл с русским текстом или кодом Морзе. Формат определяется автоматически.</p>

    <div class="card">
      <form class="row" action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required />
        <button type="submit">Загрузить и конвертировать</button>
      </form>
    </div>

    <h3>Результат</h3>
    <pre id="out">Здесь появится результат…</pre>
  </div>

  <script>
    const form = document.querySelector('form');
    const out = document.getElementById('out');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      try {
        const res = await fetch('/upload', { method:'POST', body: fd });
        out.textContent = await res.text();
      } catch (err) {
        out.textContent = 'Ошибка: ' + err;
      }
    });
  </script>
</body>
</html>
